plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}
version = '1.2.0'
group = 'dev.flr'
base { archivesName = 'flrvisuals' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.172'
    runs { client { client() } }
    mods { flrvisuals { sourceSet sourceSets.main } }
}
